<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حصّة — منصة المدرس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBF1EE;--sf:#fff;--sf2:#F4F8F6;--ink:#0F2A2E;--mut:#5D7378;--ln:#D9E3DF;--pri:#0E7C66;--yel:#F4B942;--cor:#E8685B;--blu:#3B82D6;--vio:#7A5AF0;--ok:#1E9E62;--sh:0 1px 2px rgba(15,42,46,.06),0 10px 26px -14px rgba(15,42,46,.25)}
body.dark{--bg:#0B171A;--sf:#12252A;--sf2:#1A3237;--ink:#E7F1ED;--mut:#93ABA6;--ln:#24393E;--sh:0 1px 0 rgba(255,255,255,.04)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:Cairo,Tajawal,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
h1{font-size:1.6rem;font-weight:900;line-height:1.3}
h2{font-size:1.15rem;font-weight:700}
small,.mut{color:var(--mut)}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.snav{background:var(--sf);border-inline-end:1px solid var(--ln);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.4rem;padding:4px 10px 16px}
.logo i{font-style:normal;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:#12392f;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 4px 0 #0a2019;font-size:22px}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:600;text-align:start;width:100%}
.ni:hover{background:var(--sf2)}
.ni.on{background:var(--pri);color:#fff}
main{padding:18px 22px 110px;max-width:1100px;width:100%;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--sf);box-shadow:var(--sh);font-size:20px;position:relative}
.ib b{position:absolute;top:-4px;inset-inline-start:-4px;background:var(--cor);color:#fff;font-size:.7rem;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center}
.bnav{display:none}
.card{background:var(--sf);border-radius:20px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.vh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.vh p{color:var(--mut)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:12px;background:var(--sf);border:1.5px solid var(--ln);font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.cor{background:var(--cor);border-color:var(--cor);color:#fff}
.btn.sm{padding:6px 10px;font-size:.9rem;border-radius:10px}
.hello{margin:6px 0 16px}
.hello h1{font-size:2rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--sf);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);border-inline-start:6px solid var(--c,var(--pri))}
.stat small{display:block}
.stat b{font-size:1.5rem;font-weight:900;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.tile9{background:var(--sf);border-radius:24px;padding:18px 12px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:1.05rem}
.tile9 small{font-weight:400}
.ic{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:34px;margin-bottom:8px;background:linear-gradient(155deg,var(--a),var(--b));box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(0,0,0,.14),0 6px 0 var(--d),0 14px 16px -6px var(--d);transition:transform .12s,box-shadow .12s}
.tile9:hover .ic{transform:translateY(-2px)}
.tile9:active .ic{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.14),0 2px 0 var(--d)}
.c-blue{--a:#8EC5FF;--b:#3B82D6;--d:#2A62A8}.c-grn{--a:#7FE0B0;--b:#1E9E62;--d:#147046}.c-yel{--a:#FFDD85;--b:#F0A920;--d:#B97C0B}.c-cor{--a:#FFA79D;--b:#E8685B;--d:#B3463B}.c-vio{--a:#BBA6FF;--b:#7A5AF0;--d:#5238B8}.c-teal{--a:#7FE3D6;--b:#12A394;--d:#0B756A}.c-pink{--a:#FFA9CF;--b:#E64F96;--d:#A83068}.c-sky{--a:#9FE3FF;--b:#2AA3D6;--d:#1A7699}.c-gry{--a:#C9D6D2;--b:#7E918C;--d:#576762}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border-bottom:1px solid var(--ln);text-align:start}
.row:last-child{border:0}
.rm{flex:1;display:flex;flex-direction:column;line-height:1.35}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;flex:none;background:var(--c1)}
.a0{--c1:#3B82D6}.a1{--c1:#1E9E62}.a2{--c1:#E8685B}.a3{--c1:#7A5AF0}.a4{--c1:#D98E04}
.bd{padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:700;white-space:nowrap}
.bd.good{background:#DDF5E8;color:#137046}.bd.bad{background:#FFE3E0;color:#B3342B}.bd.info{background:#E1EEFF;color:#245CA8}.bd.warn{background:#FFF0CF;color:#8A5B00}
body.dark .bd.good{background:#134331;color:#8EE6B8}body.dark .bd.bad{background:#4A1F1C;color:#FFADA5}body.dark .bd.info{background:#17304F;color:#A9CDFF}body.dark .bd.warn{background:#4A3810;color:#FFD98A}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 14px;border-radius:99px;background:var(--sf);border:1.5px solid var(--ln);font-weight:600;font-size:.92rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px}
.kv dt{color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar span:first-child{width:130px;font-size:.92rem;flex:none}
.bar i{display:block;height:14px;border-radius:7px;background:var(--pri);min-width:4px}
.bar em{font-style:normal;font-weight:700;font-size:.9rem}
.bt{flex:1;background:var(--sf2);border-radius:7px}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.8rem}
.cols i{display:block;width:100%;max-width:46px;background:var(--pri);border-radius:8px 8px 0 0;min-height:3px}
.day{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.day.today{background:linear-gradient(90deg,transparent,rgba(244,185,66,.18));border-radius:10px;padding-inline:8px}
.sess{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--sf2);margin:0 0 6px 6px;font-weight:600}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{padding:8px 14px;border-radius:12px;background:var(--sf);font-weight:700;white-space:nowrap;border:1.5px solid var(--ln)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.ov{position:fixed;inset:0;background:rgba(8,20,22,.55);display:grid;place-items:center;z-index:50;padding:14px}
.md{background:var(--sf);border-radius:22px;width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.md header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px}
.mb{padding:8px 18px;overflow:auto;display:grid;gap:12px}
.md footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-start}
label.f{display:grid;gap:4px;font-weight:600;font-size:.92rem}
.dgrid{display:flex;gap:6px;flex-wrap:wrap}
.dgrid label{display:flex;gap:4px;align-items:center;background:var(--sf2);padding:6px 10px;border-radius:10px}
.dgrid input{width:auto}
#toast{position:fixed;bottom:84px;inset-inline:0;display:grid;place-items:center;pointer-events:none;z-index:80}
#toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:600;box-shadow:var(--sh);max-width:90vw}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--ink)}
.nt{padding:10px 0;border-bottom:1px solid var(--ln)}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .card{width:min(440px,100%);padding:22px;margin:0}
.auth .tabs{margin-top:6px}
.errb{background:#FFE3E0;color:#B3342B;padding:8px 12px;border-radius:12px;margin-bottom:10px;font-weight:600}
body.dark .errb{background:#4A1F1C;color:#FFADA5}
#syn{font-size:.85rem;margin-inline-start:8px}
/* room */
.room{display:grid;grid-template-columns:1fr 350px;gap:12px;height:100vh;padding:12px}
.stage{display:flex;flex-direction:column;min-height:0;margin:0;padding:12px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.tl{width:42px;height:42px;border-radius:12px;background:var(--sf2);font-size:19px;display:grid;place-items:center;border:2px solid transparent}
.tl.on{border-color:var(--pri);background:var(--sf)}
.tl:disabled{opacity:.4}
.sep{width:1px;height:28px;background:var(--ln);margin:0 4px}
.cdot{width:26px;height:26px;border-radius:50%;border:3px solid var(--sf);box-shadow:0 0 0 1.5px var(--ln)}
.cdot.on{box-shadow:0 0 0 3px var(--ink)}
.sdot{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--sf2)}
.sdot.on{outline:2px solid var(--pri)}
.sdot i{display:block;border-radius:50%;background:var(--ink)}
.stagebody{flex:1;min-height:0;position:relative;background:#C9D6D1;border-radius:14px;overflow:hidden}
body.dark .stagebody{background:#0A1416}
.pane{position:absolute;inset:0}
.pane[hidden]{display:none}
#cv{touch-action:none;display:block}
.pane iframe,.pane video{width:100%;height:100%;border:0;background:#fff;object-fit:contain}
#scr{background:#000}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{position:relative;aspect-ratio:4/3;background:#10262a;border-radius:14px;overflow:hidden;display:grid;place-items:center;color:#fff}
.tile:first-child{grid-column:1/-1;aspect-ratio:16/9}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.camoff video{visibility:hidden}
.tile .ini{width:54px;height:54px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font-weight:900;font-size:1.4rem}
.tile .nm{position:absolute;bottom:6px;inset-inline:6px;display:flex;justify-content:space-between;font-size:.8rem;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:8px}
.ctl{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ctl button{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border-radius:14px;background:var(--sf);box-shadow:var(--sh);font-size:.7rem;font-weight:600}
.ctl button span{font-size:1.35rem}
.ctl button.off{background:#FFE3E0;color:#B3342B}
.ctl button.act{background:var(--yel);color:#3b2a00}
.ctl button.end{background:var(--cor);color:#fff}
.sp{background:var(--sf);border-radius:18px;padding:10px;box-shadow:var(--sh);flex:1;min-height:240px;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:150px;max-height:36vh;margin-bottom:8px}
.msg{background:var(--sf2);padding:6px 10px;border-radius:12px;font-size:.92rem}
.msg.me{background:#D6F2E8;color:#0b3b2f}
.msg.sys{background:none;color:var(--mut);font-size:.82rem;text-align:center}
.send{display:flex;gap:6px}
@media(max-width:960px){
 .shell{grid-template-columns:1fr}.snav{display:none}
 main{padding:14px 14px 100px}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
 .bnav button{display:flex;flex-direction:column;align-items:center;font-size:.75rem;font-weight:600;color:var(--mut);padding:2px}
 .bnav button span{font-size:1.4rem}
 .bnav button.on{color:var(--pri)}
 .stats{grid-template-columns:1fr 1fr}
 .grid{gap:10px}.ic{width:60px;height:60px;font-size:30px}
 .two{grid-template-columns:1fr}
 .room{grid-template-columns:1fr;height:auto}
 .stagebody{height:60vh;flex:none}
 .stage{min-height:0}
 .msgs{max-height:30vh}
}
@media(max-width:420px){.hello h1{font-size:1.6rem}.tile9{font-size:.95rem;padding:14px 6px 12px}.kv{grid-template-columns:100px 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.snav,.bnav,.top,.acts,#toast{display:none!important}.shell{display:block}body{background:#fff}}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fin" hidden multiple>
<script>
/* =========================================================
   حصّة — بنية متعددة المدرسين (Multi-tenant) من البداية:
   كل البيانات داخل tenant واحد (DB.t[tenantId])، والمدرس الحالي = S.tenant.
   لإضافة مدرس جديد لاحقًا: أنشئ tenant جديد بنفس الشكل.
   ========================================================= */
const NOW=new Date();
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const MODE={in:['🏠','حضوري'],online:['🌐','أونلاين'],hybrid:['🔄','حضوري + أونلاين']};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const ym=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const money=n=>Number(n).toLocaleString('en-US')+' جنيه';
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const hash=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0);
const mLabel=k=>{const[y,m]=k.split('-');return MONTHS[+m-1]+' '+y};
const shiftM=(k,n)=>{let[y,m]=k.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+p2(m)};
const fmtT=t=>{const h=+t.slice(0,2);return(h%12||12)+':'+t.slice(3)+(h>=12?' م':' ص')};
const TODAY=ymd(NOW),CUR=ym(NOW);

/* ---------- البيانات التجريبية ---------- */
function seed(){
  let r=11;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
  const groups=[
    {id:'g1',name:'الأحد والثلاثاء',grade:'الثالث الابتدائي',subject:'اللغة الإنجليزية',days:[0,2],time:'16:00',mode:'in',fee:300},
    {id:'g2',name:'الإثنين والخميس أونلاين',grade:'الثالث الابتدائي',subject:'اللغة الإنجليزية',days:[1,4],time:'19:00',mode:'online',fee:250},
    {id:'g3',name:'الأحد والأربعاء',grade:'السادس الابتدائي',subject:'اللغة الإنجليزية',days:[0,3],time:'18:00',mode:'hybrid',fee:350},
    {id:'g4',name:'السبت والإثنين',grade:'الأول الإعدادي',subject:'اللغة الإنجليزية',days:[6,1],time:'17:00',mode:'hybrid',fee:400}];
  const names=['محمد أحمد','يوسف علي','مريم حسن','آدم محمود','ملك سامي','عمر خالد','ليلى إبراهيم','كريم هاني','سلمى عادل','زياد مصطفى','جنى طارق','حمزة ياسر','هنا وليد','مالك رضا','نور أيمن','ياسين فادي','فريدة شريف','عبدالله ماجد','رقية صلاح','تيم نبيل','لينا أسامة','سيف حاتم','داليا ممدوح','أنس جمال','رودينا هشام','بلال كمال'];
  const students=names.map((n,i)=>{const g=groups[i%4];const reg=new Date(NOW.getFullYear(),NOW.getMonth()-2,1+(i*3)%27);
    return{id:'s'+(i+1),name:n,grade:g.grade,gid:g.id,subject:g.subject,phone:'01'+[0,1,2,5][i%4]+String(10000000+((i+3)*7654321)%89999999),reg:ymd(reg),fee:g.fee,how:g.mode==='hybrid'?(i%2?'in':'online'):g.mode,notes:'',files:[]}});
  const payments=[];
  students.forEach((s,i)=>monthsFrom(s.reg).forEach(m=>{const cur=m===CUR;const paid=cur?i%4!==0:i%9!==0;
    if(paid){const day=cur?Math.min(2+(i%20),NOW.getDate()):2+(i%20);payments.push({id:uid(),sid:s.id,month:m,amount:s.fee,date:m+'-'+p2(day),method:i%3?'نقدًا':'محفظة'})}}));
  const att=[];
  for(let d=0;d<=21;d++){const dt=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-d);
    groups.forEach(g=>{if(!g.days.includes(dt.getDay()))return;
      students.filter(s=>s.gid===g.id&&s.reg<=ymd(dt)).forEach(s=>{const x=rnd();att.push({id:uid(),sid:s.id,gid:g.id,date:ymd(dt),status:x<.08?'absent':x<.14?'late':'present',how:s.how})})})}
  const sc=(gid,max)=>{const o={};students.filter(s=>s.gid===gid).forEach(s=>o[s.id]=Math.round(max*(.5+rnd()*.5)));return o};
  const exams=[{id:'e1',gid:'g1',title:'اختبار الوحدة الأولى',date:ymd(new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-9)),max:20,scores:sc('g1',20)},
    {id:'e2',gid:'g3',title:'Quiz: Grammar',date:ymd(new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()-5)),max:50,scores:sc('g3',50)}];
  const hw=[{id:'h1',gid:'g1',title:'حل صفحة 14 و15 في الكتاب',due:ymd(new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+1)),done:students.filter((s,i)=>s.gid==='g1'&&i%3!==0).map(s=>s.id)},
    {id:'h2',gid:'g2',title:'كتابة 5 جمل عن عائلتك',due:ymd(new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+2)),done:[]}];
  return{t:{t1:{id:'t1',teacher:{name:'أحمد'},groups,students,payments,att,exams,hw,files:[],log:[],
    parents:[{id:'p1',name:'والدة محمد',sids:['s1']},{id:'p2',name:'والد يوسف ومريم',sids:['s2','s3']}]}}};
}
function monthsFrom(reg){const out=[];let[y,m]=reg.slice(0,7).split('-').map(Number);for(let n=0;n<48;n++){const k=y+'-'+p2(m);out.push(k);if(k>=CUR)break;m++;if(m>12){m=1;y++}}return out}
const DB=seed();
const S={tenant:'t1',role:'teacher',view:'home',q:'',gf:'all',sid:null,stab:'over',month:CUR,lib:'all',mtab:'unpaid',dark:false,boot:true,authed:false,demo:false,user:null,join:null,err:'',atab:'in',sync:''};
const T=()=>DB.t[S.tenant];
const grp=id=>T().groups.find(g=>g.id===id);
const stu=id=>T().students.find(s=>s.id===id);
const dues=s=>{const paid=new Set(T().payments.filter(p=>p.sid===s.id).map(p=>p.month));return monthsFrom(s.reg).filter(m=>!paid.has(m))};
const overdue=()=>sum(T().students,s=>dues(s).length*s.fee);
const todaySessions=()=>T().groups.filter(g=>g.days.includes(NOW.getDay())).sort((a,b)=>a.time.localeCompare(b.time));
const presentToday=()=>T().att.filter(a=>a.date===TODAY&&a.status!=='absent').length;
const rate=sid=>{const a=T().att.filter(x=>x.sid===sid);return a.length?Math.round(100*a.filter(x=>x.status!=='absent').length/a.length):0};
const logEv=text=>{T().log.push({t:Date.now(),text});persist()};
function setAtt(sid,gid,status,how,date=TODAY){const a=T().att;const r=a.find(x=>x.sid===sid&&x.date===date);if(r){r.status=status;r.how=how;r.gid=gid}else a.push({id:uid(),sid,gid,date,status,how});persist()}
function notifs(){const t=T(),o=[];
  todaySessions().filter(g=>g.mode!=='in').forEach(g=>o.push('🔔 لديك حصة أونلاين الساعة '+fmtT(g.time)+' — '+g.name));
  t.att.filter(a=>a.date===TODAY&&a.status==='absent').slice(0,3).forEach(a=>o.push('🔔 '+stu(a.sid).name+' غائب اليوم.'));
  t.students.filter(s=>dues(s).includes(CUR)).slice(0,3).forEach(s=>o.push('🔔 اشتراك '+s.name+' لشهر '+MONTHS[NOW.getMonth()]+' لم يتم دفعه.'));
  const h=t.hw[t.hw.length-1];if(h)o.push('🔔 تم رفع واجب جديد: '+h.title);
  [...t.log].reverse().slice(0,6).forEach(l=>o.push('🔔 '+l.text));
  return o}

let toastT;function toast(m){const el=$('#toast');el.innerHTML='<span>'+esc(m)+'</span>';clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',2800)}
let modalSave=null;
function openModal(title,body,save,label='حفظ'){modalSave=save;$('#modal').innerHTML=`<div class="ov" data-act="ovc"><div class="md" role="dialog" aria-modal="true"><header><h2>${title}</h2><button class="ib" style="width:36px;height:36px;font-size:16px" data-act="close" aria-label="إغلاق">✕</button></header><div class="mb">${body}</div><footer>${save?`<button class="btn pri" data-act="msave">${label}</button>`:''}<button class="btn" data-act="close">${save?'إلغاء':'إغلاق'}</button></footer></div></div>`;const f=$('#modal input,#modal select');if(f&&save)f.focus()}
const closeModal=()=>{$('#modal').innerHTML='';modalSave=null};
const rd=()=>{const v={};$$('#modal [name]').forEach(e=>{if(e.type!=='checkbox')v[e.name]=e.value});v.days=$$('#modal [name=d]:checked').map(e=>+e.value);return v};
const fld=(l,n,v='',t='text',x='')=>`<label class="f">${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(l,n,opts,v)=>`<label class="f">${l}<select name="${n}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${a===v?'selected':''}>${esc(b)}</option>`).join('')}</select></label>`;
const confirmM=(msg,fn)=>openModal('تأكيد',`<p>${msg}</p>`,()=>{fn();closeModal()},'نعم، تأكيد');
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s||''}</div>`;
const head=(t,s,a='')=>`<div class="vh"><div><h1>${t}</h1>${s?`<p>${s}</p>`:''}</div><div class="acts">${a}</div></div>`;
const bars=items=>{const mx=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div class="bar"><span>${esc(i.l)}</span><div class="bt"><i style="width:${Math.max(2,100*i.v/mx)}%;background:${i.c||'var(--pri)'}"></i></div><em>${i.t??i.v}</em></div>`).join('')};

  const got=sum(t.payments.filter(p=>p.month===m),p=>p.amount),exp=sum(act,s=>s.fee);
  const list=S.mtab==='unpaid'?(un.map(s=>`<div class="row"><span class="av a${hash(s.id)%5}">${esc(s.name[0])}</span><span class="rm"><b>${esc(s.name)}</b><small>${money(s.fee)} · ${esc(s.phone)}</small></span><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/2${esc(s.phone)}?text=${encodeURIComponent('السلام عليكم، نذكّركم بسداد اشتراك '+mLabel(m)+' للطالب '+s.name+'. شكرًا لكم.')}" data-act="remind" data-sid="${s.id}">تذكير</a><button class="btn sm pri" data-act="addPay" data-sid="${s.id}" data-m="${m}">دفعة</button></div>`).join('')||empty('الكل سدّد 🎉','لا متأخرات في هذا الشهر.')):

const BW=1600,BH=900;

let R=null;

function mkRoom(o){R=Object.assign({gid:null,gname:'',rid:'',tr:'bc',type:'online',peers:{},pcs:{},streams:{},tiles:{},strokes:[],live:{},undo:[],redo:[],tool:'pen',color:COLORS[0],size:6,allow:false,tab:'board',stab:'chat',chat:[],files:[],pdf:null,sharing:null,soundOn:true,view:null,inited:false,erasing:null,cur:null,pan:null,ready:false,q:[]},o);S.view='room';render()}

  return`<div class="room"><section class="card stage"><div class="rtop"><div><b>${esc(R.gname)}</b> <span class="bd info">${MODE[R.type][0]} ${MODE[R.type][1]}</span></div><div class="acts">${tch&&R.tr==='fs'?'<button class="btn sm pri" data-act="r:link">🔗 رابط الحصة</button>':''}<button class="btn sm" data-act="r:tab" data-id="board">📝 السبورة</button><button class="btn sm" data-act="r:tab" data-id="pdf">📄 PDF</button><button class="btn sm" data-act="r:tab" data-id="screen">🖥️ الشاشة</button></div></div>
  <div class="tools" id="tools"></div>

  <div class="pane" id="p-pdf" hidden></div>
  <div class="pane" id="p-screen" hidden><video id="scr" autoplay playsinline></video></div></div></section>
  <aside class="side"><div class="tiles" id="tiles"></div><div class="ctl" id="ctl"></div>

function rsend(m,to){if(!R)return;
  if(R.tr==='fs'){if(m.t==='live'||m.t==='file'||m.t==='pdf')return;if(!R.ready){R.q.push([m,to]);return}R.fs.send(m,to);return}
  try{R.bc.postMessage({...m,from:R.me.id,to})}catch(e){console.warn(e)}}
function flushQ(){const q=R.q;R.q=[];q.forEach(([m,to])=>rsend(m,to))}
const canDraw=()=>R.me.role==='teacher'||R.allow;
function initRoom(){
  R.inited=true;R.local=new MediaStream();
  if(R.tr==='bc'){R.bc=new BroadcastChannel(R.rid);R.bc.onmessage=e=>onMsg(e.data);R.ready=true}
  R.cv=$('#cv');const cv=R.cv;
  R.ro=new ResizeObserver(()=>{fit();draw()});R.ro.observe(cv.parentElement);
  cv.addEventListener('pointerdown',pDown);cv.addEventListener('pointermove',pMove);cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
  cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomBy(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  window.addEventListener('pagehide',roomBye);
  if(R.tr==='fs'){FB.roomOpen(R.rid,R.me.id,onMsg).then(tr=>{if(!R){tr.close();return}R.fs=tr;R.ready=true;flushQ();rsend({t:'hello',p:R.me})}).catch(e=>{console.warn(e);toast('تعذّر فتح الغرفة: '+errText(e))})}
  else rsend({t:'hello',p:R.me});
  fit();draw();updateTools();updateCtl();updateTiles();updateSide();setTab('board');
  sysMsg('دخلت الغرفة. افتح الكاميرا والميكروفون من الأزرار بالأسفل.');
  if(R.tr==='fs'&&R.me.role==='teacher')setTimeout(()=>A['r:link'](),400)}
function roomBye(){if(R&&(R.bc||R.fs))rsend({t:'bye'})}
function leaveRoom(){roomBye();try{R.bc&&R.bc.close();R.fs&&R.fs.close()}catch(e){}R.ro&&R.ro.disconnect();Object.keys(R.pcs).forEach(closePc);[R.camTrack,R.micTrack,R.screenTrack].forEach(t=>t&&t.stop());window.removeEventListener('pagehide',roomBye);R=null;S.view=S.join&&!S.authed?'home':'live';render()}
/* --- رسائل --- */
function onMsg(m){if(!R||m.from===R.me.id||(m.to&&m.to!==R.me.id))return;
  const P=R.peers[m.from];
  switch(m.t){
    case'hello':addPeer(m.p);if(!m.re)rsend({t:'hello',p:R.me,re:1},m.from);if(R.me.role==='teacher'){sendState(m.from);if(m.p.role==='student'){const sid=m.p.sid||matchStudent(m.p.name);if(sid){if(R.peers[m.from])R.peers[m.from].sid=sid;setAtt(sid,R.gid,'present','online');logEv(m.p.name+' دخل الحصة أونلاين');updateSide()}else if(!m.re)toast('انضم '+m.p.name+' — لم يُطابق قائمة الطلاب، سجّل حضوره يدويًا')}}break;
    case'bye':removePeer(m.from);break;
    case'sig':onSig(m);break;
    case'state':if(m.strokes)R.strokes=m.strokes;R.allow=m.allow;(m.files||[]).forEach(addFileLocal);if(m.pdf)setPdf(m.pdf.name,m.pdf.blob,true);if(m.type){R.type=m.type}updateTools();draw();break;
    case'add':delete R.live[m.from];if(!R.strokes.some(x=>x.id===m.s.id))R.strokes.push(m.s);draw();break;
    case'addm':m.ss.forEach(s=>{if(!R.strokes.some(x=>x.id===s.id))R.strokes.push(s)});draw();break;
    case'del':R.strokes=R.strokes.filter(s=>!m.ids.includes(s.id));draw();break;
    case'live':R.live[m.from]=m.s;draw();break;
    case'chat':pushChat(m.name,m.text,false);break;
    case'hand':if(P){P.hand=m.up;updateTiles();updateSide();if(m.up&&R.me.role==='teacher')toast('✋ '+P.name+' رفع يده')}break;
    case'lower':if(m.to===R.me.id){R.me.hand=false;updateCtl();updateTiles()}break;
    case'media':if(P){P.mic=m.mic;P.cam=m.cam;updateTiles();updateSide()}break;
    case'allow':R.allow=m.v;updateTools();break;
    case'file':addFileLocal(m.f);updateSide();toast('📚 ملف جديد: '+m.f.name);break;
    case'pdf':setPdf(m.name,m.blob,true);break;
    case'screen':R.sharing=m.on?m.from:null;bindScreen();if(m.on)setTab('screen');else if(R.tab==='screen')setTab('board');updateTiles();break}}
function sendState(to){const fs=R.tr==='fs';
  rsend({t:'state',allow:R.allow,type:R.type,files:fs?[]:R.files.map(f=>({id:f.id,name:f.name,blob:f.blob})),pdf:(!fs&&R.pdf)?{name:R.pdf.name,blob:R.pdf.blob}:null},to);
  let buf=[],sz=0;R.strokes.forEach(st=>{const l=JSON.stringify(st).length;if(sz+l>300000&&buf.length){rsend({t:'addm',ss:buf},to);buf=[];sz=0}buf.push(st);sz+=l});
  if(buf.length)rsend({t:'addm',ss:buf},to)}
const nrm=x=>String(x||'').replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
function matchStudent(name){const n=nrm(name);if(!n)return null;const ss=T().students.filter(x=>x.gid===R.gid);
  const ex=ss.find(x=>nrm(x.name)===n);if(ex)return ex.id;const pre=ss.filter(x=>nrm(x.name).startsWith(n)||n.startsWith(nrm(x.name)));return pre.length===1?pre[0].id:null}
function addPeer(p){if(R.peers[p.id])return;R.peers[p.id]={...p,hand:!!p.hand};if(!p.fake)pcFor(p.id);updateTiles();updateSide();pushChat('',p.name+' انضم للحصة',null)}
function removePeer(id){const p=R.peers[id];if(!p)return;closePc(id);delete R.peers[id];delete R.streams[id];delete R.live[id];if(R.sharing===id){R.sharing=null;setTab('board')}updateTiles();updateSide();draw();pushChat('',p.name+' غادر الحصة',null)}
/* --- WebRTC (التوقيع عبر BroadcastChannel؛ للإنتاج استبدله بـ WebSocket) --- */
function pcFor(pid){if(R.pcs[pid])return R.pcs[pid];
  const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});

const COLS={groups:'i',students:'i',exams:'i',hw:'i',parents:'i',payments:'c',att:'c',log:'c'};
const CKEY={payments:p=>p.month,att:a=>a.date.slice(0,7),log:l=>ym(new Date(l.t))};
function serialize(t){const o={};for(const c in COLS){const m=new Map();
  if(COLS[c]==='i')t[c].forEach(it=>m.set(it.id,JSON.stringify(c==='students'?{...it,files:[]}:it)));
  else{const g={};t[c].forEach(it=>(g[CKEY[c](it)]=g[CKEY[c](it)]||[]).push(it));for(const k in g)m.set(k,JSON.stringify(g[k]))}
  o[c]=m}return o}
let last=null,pt=null,flushing=false;
function persist(){if(!S.authed||S.demo||!last)return;clearTimeout(pt);pt=setTimeout(flush,700)}
async function flush(){if(!S.authed||S.demo||!last||flushing)return;const cur=serialize(T()),ops=[];
  for(const c in COLS){cur[c].forEach((v,id)=>{if(last[c].get(id)!==v)ops.push({col:c,id,d:v})});last[c].forEach((v,id)=>{if(!cur[c].has(id))ops.push({col:c,id,d:null})})}
  if(!ops.length)return;flushing=true;setSync('saving');
  try{await FB.commit(S.user.uid,ops);last=cur;setSync('saved')}catch(e){console.warn(e);setSync('error');toast('تعذّر الحفظ: '+errText(e))}
  finally{flushing=false;persist()}}
